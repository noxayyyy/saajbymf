# ============================================================
# SAAJ by MF — Nginx Config (HTTPS with SSL)
# Use this AFTER running Certbot successfully
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name saajbymf.mtai.live;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name saajbymf.mtai.live;

    # SSL certificates — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/saajbymf.mtai.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saajbymf.mtai.live/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    root /var/www/saajbymf;

    # Uploaded product/payment images
    location /uploads/ {
        alias /var/www/saajbymf/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Static public assets
    location /public/ {
        alias /var/www/saajbymf/public/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Built JS/CSS/image assets (cache-busted filenames — safe to cache forever)
    location /assets/ {
        alias /var/www/saajbymf/dist/public/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy everything else to Node.js (port 2600)
    location / {
        proxy_pass http://127.0.0.1:2600;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    error_log  /var/log/nginx/saajbymf_error.log;
    access_log /var/log/nginx/saajbymf_access.log;
}
