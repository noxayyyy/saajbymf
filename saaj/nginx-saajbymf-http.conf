# ============================================================
# SAAJ by MF — Nginx Config (HTTP only — pre-SSL)
# Use this FIRST to verify the site loads over HTTP,
# then run Certbot and switch to nginx-saajbymf.conf
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name saajbymf.mtai.live;

    client_max_body_size 20M;

    root /var/www/saajbymf;

    # Uploaded product/payment images
    location /uploads/ {
        alias /var/www/saajbymf/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Static public assets
    location /public/ {
        alias /var/www/saajbymf/public/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Built JS/CSS/image assets
    location /assets/ {
        alias /var/www/saajbymf/dist/public/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy everything else to Node.js (port 2600)
    location / {
        proxy_pass http://127.0.0.1:2600;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    error_log  /var/log/nginx/saajbymf_error.log;
    access_log /var/log/nginx/saajbymf_access.log;
}
